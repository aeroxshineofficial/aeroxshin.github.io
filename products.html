<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - AeroXshine</title>
  <meta name="description" content="Browse AeroXshine premium cleaning products. Floor cleaners, glass cleaners, handwash, dishwash, phenyl and more.">
  <meta name="keywords" content="AeroXshine products, cleaning products, floor cleaner, glass cleaner, handwash">
  <meta property="og:title" content="Products - AeroXshine">
  <meta property="og:description" content="Browse AeroXshine premium cleaning products.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1>Our Products</h1>
        <div class="breadcrumb"><a href="index.html">Home</a> / Products</div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filter-bar">
          <input type="text" id="search-input" placeholder="Search products..." aria-label="Search products">
          <select id="category-filter" aria-label="Filter by category">
            <option value="all">All Categories</option>
          </select>
          <select id="sort-filter" aria-label="Sort products">
            <option value="default">Sort By</option>
            <option value="name-az">Name: A to Z</option>
            <option value="name-za">Name: Z to A</option>
          </select>
          <select id="availability-filter" aria-label="Filter by availability">
            <option value="all">All Availability</option>
            <option value="available">In Stock Only</option>
            <option value="unavailable">Out of Stock</option>
          </select>
        </div>

        <div id="results-count" style="font-size:.9rem;color:var(--text-muted);margin-bottom:16px"></div>

        <div class="products-showcase" id="product-grid"></div>

        <div class="no-results" id="no-results" style="display:none">
          <h3>No products found</h3>
          <p>Try adjusting your search or filter criteria.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/products-page.js"></script>
</body>
</html>
